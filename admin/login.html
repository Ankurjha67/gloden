<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login • Golden Properties</title>
  <link rel="icon" type="image/png" href="/assest/Golden-Properties-Luxury-Logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { poppins: ['Poppins', 'sans-serif'] },
          colors: {
            copper: '#A8774A',
            copperDark: '#8E5E34',
            copperLight: '#C9996B',
            darkBg: '#0F0E0D',
            darkCard: '#181715'
          }
        }
      }
    }
  </script>
</head>
<body class="font-poppins bg-darkBg text-white min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  
  <!-- Subtle Background Pattern -->
  <div class="absolute inset-0 opacity-[0.14] pointer-events-none"
    style="background-image: radial-gradient(#C9996B 1px, transparent 1px); background-size: 24px 24px;"></div>
  
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[350px] bg-copper/20 rounded-full blur-[140px] pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center mb-4">
        <img src="/assest/Golden-Properties-Luxury-Logo.png" alt="Golden Properties" class="h-20 sm:h-24 md:h-28 w-auto object-contain mx-auto" />
      </div>
      <p class="text-xs uppercase tracking-[0.25em] text-copperLight font-semibold">Management Console</p>
    </div>

    <div class="bg-darkCard/90 backdrop-blur-xl border border-white/10 p-8 rounded-3xl shadow-2xl">
      <h2 class="text-xl font-semibold mb-1 text-white">Welcome Back</h2>
      <p class="text-sm text-gray-400 mb-6">Enter your credentials to access the admin console.</p>

      <div id="errorAlert" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-xs flex items-center gap-2">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
        <span id="errorMessage">Invalid credentials</span>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-wider text-gray-300 font-medium mb-1.5">Username</label>
          <input type="text" id="username" required value="admin"
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-copper transition" placeholder="Enter username">
        </div>

        <div>
          <label class="block text-xs uppercase tracking-wider text-gray-300 font-medium mb-1.5">Password</label>
          <input type="password" id="password" required value="password123"
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-copper transition" placeholder="••••••••">
        </div>

        <button type="submit" id="loginBtn"
          class="w-full mt-2 py-3.5 bg-copper hover:bg-copperDark text-white font-medium rounded-xl text-sm transition shadow-lg shadow-copper/20 flex items-center justify-center gap-2">
          <span>Sign In to Dashboard</span>
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-white/10 text-center">
        <p class="text-xs text-gray-400">Default demo credentials: <span class="text-copperLight font-mono">admin</span> / <span class="text-copperLight font-mono">password123</span></p>
        <a href="/" class="mt-3 inline-block text-xs text-gray-400 hover:text-white transition">← Back to Golden Properties Website</a>
      </div>
    </div>
  </div>

  <script>
    // Auto redirect if already logged in
    if (localStorage.getItem('golden_admin_token')) {
      window.location.href = '/admin/index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('errorAlert');
      const errMsg = document.getElementById('errorMessage');
      const btn = document.getElementById('loginBtn');
      errBox.classList.add('hidden');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.innerHTML = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('golden_admin_token', data.token);
          localStorage.setItem('golden_admin_user', data.username);
          window.location.href = '/admin/index.html';
        } else {
          errMsg.textContent = data.message || 'Login failed';
          errBox.classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = 'Sign In to Dashboard';
        }
      } catch (err) {
        errMsg.textContent = 'Server connection error. Ensure server is running.';
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = 'Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
