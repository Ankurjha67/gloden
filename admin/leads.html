<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Client Inquiries • Golden Properties Admin</title>
  <link rel="icon" type="image/png" href="/assest/Golden-Properties-Luxury-Logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { poppins: ['Poppins', 'sans-serif'] },
          colors: {
            copper: '#A8774A',
            copperDark: '#8E5E34',
            copperLight: '#C9996B',
            darkBg: '#0F0E0D',
            darkCard: '#181715',
            darkBorder: '#272522'
          }
        }
      }
    }
  </script>
</head>
<body class="font-poppins bg-[#0A0908] text-gray-200 min-h-screen flex">

  <!-- ================= SIDEBAR ================= -->
  <aside class="w-64 bg-darkCard border-r border-darkBorder flex flex-col justify-between hidden md:flex shrink-0">
    <div>
      <!-- Brand Logo -->
      <a href="/admin/index.html" class="h-24 px-6 flex items-center border-b border-darkBorder">
        <img src="/assest/Golden-Properties-Luxury-Logo.png" alt="Golden Properties" class="h-12 sm:h-14 w-auto object-contain" />
      </a>

      <nav class="p-4 space-y-1.5 text-sm">
        <a href="/admin/index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          Dashboard
        </a>
        <a href="/admin/properties.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Properties
        </a>
        <a href="/admin/blogs.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/></svg>
          Editorial Blogs
        </a>
        <a href="/admin/leads.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-copper/15 text-copperLight font-medium">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          Client Inquiries
        </a>
      </nav>
    </div>

    <div class="p-4 border-t border-darkBorder space-y-2">
      <a href="/" target="_blank" class="flex items-center justify-between px-4 py-2.5 rounded-xl text-xs text-gray-400 hover:text-white hover:bg-white/5 transition">
        <span>View Live Website</span>
        <span>↗</span>
      </a>
      <button onclick="logout()" class="w-full flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs text-red-400 hover:bg-red-500/10 transition">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>
    </div>
  </aside>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
    <!-- Header -->
    <header class="h-20 bg-darkCard/50 backdrop-blur border-b border-darkBorder px-6 sm:px-10 flex items-center justify-between sticky top-0 z-30">
      <div class="flex items-center gap-4">
        <a href="/admin/index.html" class="md:hidden flex items-center">
          <img src="/assest/Golden-Properties-Luxury-Logo.png" alt="Golden Properties" class="h-10 w-auto object-contain" />
        </a>
        <h1 class="text-lg font-semibold text-white hidden md:block">Investor Inquiries &amp; Leads</h1>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="loadLeads()" class="px-3.5 py-2 bg-white/5 hover:bg-white/10 text-gray-300 text-xs font-medium rounded-xl transition flex items-center gap-1.5">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>
          Refresh
        </button>
      </div>
    </header>

    <!-- Page Body -->
    <div class="p-6 sm:p-10 space-y-6 max-w-7xl">
      <!-- Filter Bar -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-darkCard p-4 rounded-2xl border border-darkBorder">
        <div class="flex items-center gap-2">
          <button onclick="filterStatus('All')" id="filterBtnAll" class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-copper text-white transition">All</button>
          <button onclick="filterStatus('New')" id="filterBtnNew" class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white/5 text-gray-400 hover:text-white transition">New Only</button>
          <button onclick="filterStatus('Contacted')" id="filterBtnContacted" class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white/5 text-gray-400 hover:text-white transition">Contacted</button>
          <button onclick="filterStatus('Closed')" id="filterBtnClosed" class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white/5 text-gray-400 hover:text-white transition">Closed</button>
        </div>

        <div class="text-xs text-gray-400">
          Showing <span id="leadsCount" class="font-semibold text-copperLight">0</span> Inquiries
        </div>
      </div>

      <!-- Leads Table -->
      <div class="bg-darkCard rounded-3xl border border-darkBorder overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-white/[0.02] text-gray-400 uppercase tracking-wider text-[11px] border-b border-darkBorder">
              <tr>
                <th class="py-4 px-6">Investor / Client</th>
                <th class="py-4 px-6">Phone &amp; Email</th>
                <th class="py-4 px-6">Property Interest</th>
                <th class="py-4 px-6">Message / Query</th>
                <th class="py-4 px-6">Date Received</th>
                <th class="py-4 px-6">Status Pipeline</th>
                <th class="py-4 px-6 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="leadsTableBody" class="divide-y divide-darkBorder">
              <tr>
                <td colspan="7" class="py-12 text-center text-gray-500">Loading client inquiries...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script>
    if (!localStorage.getItem('golden_admin_token')) {
      window.location.href = '/admin/login.html';
    }

    function logout() {
      localStorage.removeItem('golden_admin_token');
      localStorage.removeItem('golden_admin_user');
      window.location.href = '/admin/login.html';
    }

    let allLeads = [];
    let currentFilter = 'All';

    async function loadLeads() {
      try {
        const res = await fetch('/api/leads');
        allLeads = await res.json();
        renderLeads();
      } catch (err) {
        console.error(err);
      }
    }

    function filterStatus(status) {
      currentFilter = status;
      ['All', 'New', 'Contacted', 'Closed'].forEach(s => {
        const btn = document.getElementById('filterBtn' + s);
        if (s === status) {
          btn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-medium bg-copper text-white transition';
        } else {
          btn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white/5 text-gray-400 hover:text-white transition';
        }
      });
      renderLeads();
    }

    function renderLeads() {
      const filtered = currentFilter === 'All' ? allLeads : allLeads.filter(l => l.status === currentFilter);
      document.getElementById('leadsCount').textContent = filtered.length;
      const tbody = document.getElementById('leadsTableBody');

      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-12 text-center text-gray-500">No inquiries found in this view.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(lead => `
        <tr class="hover:bg-white/[0.02] transition">
          <td class="py-4 px-6 font-semibold text-white">
            ${lead.name}
          </td>
          <td class="py-4 px-6 text-gray-300">
            <div><a href="tel:${lead.phone}" class="hover:text-copperLight transition font-medium">${lead.phone || '—'}</a></div>
            <div class="text-[11px] text-gray-500"><a href="mailto:${lead.email}" class="hover:underline">${lead.email || '—'}</a></div>
          </td>
          <td class="py-4 px-6 text-copperLight font-medium">
            ${lead.property}
          </td>
          <td class="py-4 px-6 text-gray-400 max-w-xs leading-relaxed">
            ${lead.message || '—'}
          </td>
          <td class="py-4 px-6 text-gray-500 text-[11px]">
            ${lead.createdAt}
          </td>
          <td class="py-4 px-6">
            <select onchange="updateLeadStatus('${lead.id}', this.value)"
              class="bg-white/5 border border-white/10 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-copper transition">
              <option value="New" ${lead.status === 'New' ? 'selected' : ''} class="bg-darkCard text-amber-400">New</option>
              <option value="Contacted" ${lead.status === 'Contacted' ? 'selected' : ''} class="bg-darkCard text-sky-400">Contacted</option>
              <option value="Closed" ${lead.status === 'Closed' ? 'selected' : ''} class="bg-darkCard text-emerald-400">Closed</option>
            </select>
          </td>
          <td class="py-4 px-6 text-right">
            <button onclick="deleteLead('${lead.id}')" class="px-2.5 py-1 rounded bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs transition">
              Delete
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function updateLeadStatus(id, newStatus) {
      try {
        const res = await fetch(`/api/leads/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        if (res.ok) {
          const idx = allLeads.findIndex(l => l.id === id);
          if (idx !== -1) allLeads[idx].status = newStatus;
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function deleteLead(id) {
      if (!confirm('Delete this inquiry?')) return;
      try {
        const res = await fetch(`/api/leads/${id}`, { method: 'DELETE' });
        if (res.ok) {
          allLeads = allLeads.filter(l => l.id !== id);
          renderLeads();
        }
      } catch (err) {
        console.error(err);
      }
    }

    loadLeads();
  </script>
</body>
</html>
